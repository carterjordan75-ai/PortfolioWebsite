<style>
  html,body{margin:0;height:100%;background:#000;transition:background .2s;overflow:hidden;font:12px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#9a9aa0}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  #panel{position:fixed;top:14px;right:14px;width:246px;padding:10px 12px;border-radius:12px;background:rgba(24,24,26,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);user-select:none}
  #panel.hidden .row,#panel.hidden .grp{display:none}
  .grp{border-top:1px solid #2c2c31;padding:2px 0}
  .grp summary{list-style:none;cursor:pointer;user-select:none;display:flex;justify-content:space-between;align-items:center;padding:6px 0 4px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8a8a92}
  .grp summary::-webkit-details-marker{display:none}
  .grp summary::after{content:'▾';font-size:11px;color:#6d6d74;transition:transform .15s}
  .grp:not([open]) summary::after{transform:rotate(-90deg)}
  .grp summary:hover{color:#c8c8ce}
  .sub{margin:8px 0 2px;font-size:10px;color:#5f5f66}
  #panel h3{margin:0 0 6px;font-size:12px;font-weight:600;color:#ccc;cursor:pointer}
  .row{display:flex;align-items:center;justify-content:space-between;margin:5px 0;gap:8px}
  .row span{white-space:nowrap}
  .row input{width:120px;accent-color:#e9a3a8}
  .row select,.row button{background:#2a2a2e;color:#ccc;border:1px solid #3a3a40;border-radius:6px;font:inherit;padding:3px 6px}
  .row select{width:126px}
  .row button{cursor:pointer}
  .row button:hover{background:#34343a}
  .row label{display:flex;align-items:center;gap:4px;cursor:pointer}
  #pmeter{width:120px;height:6px;border-radius:3px;background:#2a2a2e;overflow:hidden}
  #pbar{height:100%;width:0;background:#e9a3a8;transition:width .05s}
  #pmeterLabel{font-variant-numeric:tabular-nums}
  .row input[type=color]{width:120px;height:20px;padding:0;border:1px solid #3a3a40;border-radius:6px;background:none;cursor:pointer}
  .sec{margin:9px 0 3px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#6d6d74}
  #panel{max-height:calc(100vh - 28px);overflow-y:auto}
  #panel hr{border:0;border-top:1px solid #333;margin:8px 0}
  #drop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,10,12,.7);color:#ddd;font-size:16px;pointer-events:none;border:2px dashed #555;box-sizing:border-box}
  #drop.on{display:flex}
  #hint{position:fixed;bottom:18px;width:100%;text-align:center;color:#4a4a50;pointer-events:none}
  #stats{position:fixed;left:12px;bottom:12px;color:#3a3a40;font-variant-numeric:tabular-nums;pointer-events:none}

  [hidden]{display:none !important}
  body{color:#bcb8c4}
  canvas{position:absolute;inset:0;outline:none}
  canvas:focus-visible{outline:1px solid #bcb8c4;outline-offset:-8px}
  header,footer{position:fixed;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;z-index:2}
  header{top:30px;font-size:10px;letter-spacing:.17em;color:#8d8993;pointer-events:none}
  footer{bottom:28px;font-size:13px;letter-spacing:.01em}
  footer>div{display:flex;gap:10px}
  footer button{font:inherit;padding:10px 15px;border:1px solid #39363e;border-radius:24px;background:#141216;color:#c8c4cf;cursor:pointer}
  footer button:hover{background:#29242e}
  footer button:focus-visible{outline:2px solid #dfcdeb;outline-offset:3px}
  #instruction{color:#a5a0ab}
  #panel{top:65px;right:32px;bottom:88px;width:264px;max-height:none;z-index:3;padding:16px;background:rgba(24,22,28,.96);border:1px solid #39333f}
  #panel h3{font-size:13px;margin-bottom:14px}
  #panel .grp summary{padding:12px 0}
  #stats{display:none}
  #hint{display:none}
  body:has(canvas:focus-visible) #hint{display:block;bottom:80px;font-size:11px}
  #fallback{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#d8d4e4}
  #fallback svg{width:81.5vw;max-height:48vh;overflow:visible}
  @media(max-width:600px){header,footer{left:20px;right:20px}header{top:22px}.edition{display:none}footer{bottom:22px;align-items:flex-start;gap:20px;flex-direction:column}footer button{font-size:12px}#panel{left:20px;right:20px;width:auto;top:55px;bottom:130px}#hint{display:none!important}}
</style>

<script id="engine-src" type="text/plain">
// Gel button physics engine: XPBD tetrahedral FEM, stable Neo-Hookean (Macklin & Mueller 2021)
// Runs in a Worker, on the main thread, or in node. No dependencies.

// ---------------------------------------------------------------- shapes (shared with the page)
// Any outline works: the engine only needs a signed distance function (world units, < 0 inside).
// Default = the analytic quatrefoil; a custom UI shape arrives as a signed-distance grid
// { n, w, data: Float32Array(n*n) }, cell (i, j) centred at (-w + (i + .5)*2w/n, -w + (j + .5)*2w/n), y up.
// Shapes are normalised by the page to the quatrefoil's footprint (half-extent 0.93), so every
// material / thumb parameter means the same thing on every shape.
function gelSdClover(x, y){
  const smin = (a, b, k) => { const h = Math.max(k - Math.abs(a - b), 0)/k; return Math.min(a, b) - h*h*k*0.25; };
  const A = 0.42, R = 0.51, K = 0.18;
  let d = Math.hypot(x, y) - 0.6;
  d = smin(d, Math.hypot(x - A, y - A) - R, K); d = smin(d, Math.hypot(x + A, y - A) - R, K);
  d = smin(d, Math.hypot(x + A, y + A) - R, K); d = smin(d, Math.hypot(x - A, y + A) - R, K);
  return d;
}
function gelGridSDF(S){
  const n = S.n, w = S.w, h = 2*w/n, D = S.data, n1 = n - 1;
  return function(x, y){
    let fx = (x + w)/h - 0.5, fy = (y + w)/h - 0.5;
    const cx = fx < 1 ? 1 : fx > n - 2.001 ? n - 2.001 : fx, cy = fy < 1 ? 1 : fy > n - 2.001 ? n - 2.001 : fy;
    const ext = (fx !== cx || fy !== cy) ? Math.hypot(fx - cx, fy - cy)*h : 0;
    const i = Math.floor(cx), j = Math.floor(cy), tx = cx - i, ty = cy - j;
    // Catmull-Rom bicubic: C1 distance field -> smooth normals and offset curves
    const tx2 = tx*tx, tx3 = tx2*tx, ty2 = ty*ty, ty3 = ty2*ty;
    const a0 = (-tx3 + 2*tx2 - tx)/2, a1 = (3*tx3 - 5*tx2 + 2)/2, a2 = (-3*tx3 + 4*tx2 + tx)/2, a3 = (tx3 - tx2)/2;
    const b0 = (-ty3 + 2*ty2 - ty)/2, b1 = (3*ty3 - 5*ty2 + 2)/2, b2 = (-3*ty3 + 4*ty2 + ty)/2, b3 = (ty3 - ty2)/2;
    let s = 0;
    for (let r = 0; r < 4; r++){
      const o = Math.min(n1, Math.max(0, j - 1 + r))*n, i0 = i - 1;
      const row = a0*D[o + i0] + a1*D[o + i0 + 1] + a2*D[o + i0 + 2] + a3*D[o + i0 + 3];
      s += (r === 0 ? b0 : r === 1 ? b1 : r === 2 ? b2 : b3)*row;
    }
    return s + ext;
  };
}

// Binary coverage mask (M x M over [-W, W]^2, row 0 at y = -W) -> rounded signed-distance grid (N x N).
// Concave corners are filled with radius rc (closing) and convex corners rounded with radius ro (opening):
// a gel body has no knife edges, and sharp inner corners would pinch the mesh.
function gelMaskToGrid(inside, M, W, N, rc, ro){
  const hw = 2*W/M;
  function edt1d(f, d, n, v, z){
    let k = 0; v[0] = 0; z[0] = -1e20; z[1] = 1e20;
    for (let q = 1; q < n; q++){
      let s = ((f[q] + q*q) - (f[v[k]] + v[k]*v[k]))/(2*q - 2*v[k]);
      while (s <= z[k]){ k--; s = ((f[q] + q*q) - (f[v[k]] + v[k]*v[k]))/(2*q - 2*v[k]); }
      k++; v[k] = q; z[k] = s; z[k+1] = 1e20;
    }
    k = 0; for (let q = 0; q < n; q++){ while (z[k+1] < q) k++; d[q] = (q - v[k])*(q - v[k]) + f[v[k]]; }
  }
  const f = new Float64Array(M), dd = new Float64Array(M), v = new Int32Array(M), z = new Float64Array(M + 1);
  function edt(g){
    for (let x = 0; x < M; x++){ for (let y = 0; y < M; y++) f[y] = g[y*M + x]; edt1d(f, dd, M, v, z); for (let y = 0; y < M; y++) g[y*M + x] = dd[y]; }
    for (let y = 0; y < M; y++){ for (let x = 0; x < M; x++) f[x] = g[y*M + x]; edt1d(f, dd, M, v, z); for (let x = 0; x < M; x++) g[y*M + x] = dd[x]; }
  }
  function sdOf(ins){   // signed distance in pixels
    const gi = new Float64Array(M*M), go = new Float64Array(M*M), out = new Float64Array(M*M);
    for (let k = 0; k < M*M; k++){ gi[k] = ins[k] ? 1e20 : 0; go[k] = ins[k] ? 0 : 1e20; }
    edt(gi); edt(go);
    for (let k = 0; k < M*M; k++) out[k] = ins[k] ? -(Math.sqrt(gi[k]) - 0.5) : Math.sqrt(go[k]) - 0.5;
    return out;
  }
  const rcp = rc/hw, rop = ro/hw, m2 = new Uint8Array(M*M);
  let sd;
  if (rcp > 0.5){
    // closing per connected part: inner corners are filleted, but separate parts never get bridged
    const lab = new Int32Array(M*M), comps = []; let nc = 0;
    for (let k0 = 0; k0 < M*M; k0++){
      if (!inside[k0] || lab[k0]) continue;
      nc++; const st = [k0]; lab[k0] = nc; let area = 0;
      while (st.length){ const k = st.pop(), x = k % M, y = (k/M) | 0; area++;
        if (x > 0 && inside[k - 1] && !lab[k - 1]){ lab[k - 1] = nc; st.push(k - 1); }
        if (x < M - 1 && inside[k + 1] && !lab[k + 1]){ lab[k + 1] = nc; st.push(k + 1); }
        if (y > 0 && inside[k - M] && !lab[k - M]){ lab[k - M] = nc; st.push(k - M); }
        if (y < M - 1 && inside[k + M] && !lab[k + M]){ lab[k + M] = nc; st.push(k + M); } }
      comps.push(area);
    }
    const closed = new Uint8Array(M*M);
    if (nc <= 16){
      const one = new Uint8Array(M*M);
      for (let c = 1; c <= nc; c++){
        if (comps[c - 1] < 30) { for (let k = 0; k < M*M; k++) if (lab[k] === c) closed[k] = 1; continue; }
        for (let k = 0; k < M*M; k++) one[k] = lab[k] === c ? 1 : 0;
        const d1 = sdOf(one); for (let k = 0; k < M*M; k++) m2[k] = d1[k] < rcp ? 1 : 0;
        const d2 = sdOf(m2); for (let k = 0; k < M*M; k++) if (d2[k] + rcp < 0) closed[k] = 1;
      }
    } else {
      const d1 = sdOf(inside); for (let k = 0; k < M*M; k++) m2[k] = d1[k] < 0.5*rcp ? 1 : 0;
      const d2 = sdOf(m2); for (let k = 0; k < M*M; k++) closed[k] = d2[k] + 0.5*rcp < 0 ? 1 : 0;
    }
    sd = sdOf(closed);
  } else sd = sdOf(inside);
  if (rop > 0.5){ for (let k = 0; k < M*M; k++) m2[k] = sd[k] < -rop ? 1 : 0; sd = sdOf(m2); for (let k = 0; k < M*M; k++) sd[k] -= rop; }

      while (st.length){ const i = st.pop(), x = i % w, y = (i/w) | 0;
        for (const j of [x > 0 ? i - 1 : -1, x < w - 1 ? i + 1 : -1, y > 0 ? i - w : -1, y < h - 1 ? i + w : -1]) if (j >= 0 && !out[j] && m[j] < 0.5){ out[j] = 1; st.push(j); } }
      for (let i = 0; i < w*h; i++) if (!out[i]) m[i] = Math.max(m[i], 1);
    }
    return { m, w, h };
  }
  function edt1d(f, d, n, v, z){
    let k = 0; v[0] = 0; z[0] = -1e20; z[1] = 1e20;
    for (let q = 1; q < n; q++){
      let s = ((f[q] + q*q) - (f[v[k]] + v[k]*v[k]))/(2*q - 2*v[k]);
      while (s <= z[k]){ k--; s = ((f[q] + q*q) - (f[v[k]] + v[k]*v[k]))/(2*q - 2*v[k]); }
      k++; v[k] = q; z[k] = s; z[k+1] = 1e20;
    }
    k = 0; for (let q = 0; q < n; q++){ while (z[k+1] < q) k++; d[q] = (q - v[k])*(q - v[k]) + f[v[k]]; }
  }
  function edt(g, M){   // g: 0 at sources, 1e20 elsewhere; in-place squared distance
    const f = new Float64Array(M), dd = new Float64Array(M), v = new Int32Array(M), z = new Float64Array(M + 1);
    for (let x = 0; x < M; x++){ for (let y = 0; y < M; y++) f[y] = g[y*M + x]; edt1d(f, dd, M, v, z); for (let y = 0; y < M; y++) g[y*M + x] = dd[y]; }
    for (let y = 0; y < M; y++){ for (let x = 0; x < M; x++) f[x] = g[y*M + x]; edt1d(f, dd, M, v, z); for (let x = 0; x < M; x++) g[y*M + x] = dd[x]; }
  }
  function toGrid({ m, w, h }){
    let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (m[y*w + x] > 0.5){ if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    if (x1 < 0) throw new Error('no shape found in that image');
    const scale = 2*FIT/Math.max(x1 - x0 + 1, y1 - y0 + 1), cx = (x0 + x1 + 1)/2, cy = (y0 + y1 + 1)/2;
    const M = N*SS, hw = 2*W/M, inside = new Uint8Array(M*M);
    const smp = (u, v) => { u -= 0.5; v -= 0.5; const i = Math.floor(u), j = Math.floor(v), tx = u - i, ty = v - j;
      const at = (a, b) => (a < 0 || b < 0 || a >= w || b >= h) ? 0 : m[b*w + a];
      return (at(i, j)*(1 - tx) + at(i + 1, j)*tx)*(1 - ty) + (at(i, j + 1)*(1 - tx) + at(i + 1, j + 1)*tx)*ty; };
    for (let j = 0; j < M; j++) for (let i = 0; i < M; i++){ const x = -W + (i + .5)*hw, y = -W + (j + .5)*hw; inside[j*M + i] = smp(cx + x/scale, cy - y/scale) > 0.5 ? 1 : 0; }
    return gelMaskToGrid(inside, M, W, N, 0.006, 0.004);
  }
  return { async build(src, o){ o = o || {}; return toGrid(mask(await rasterize(src), o.fillHoles)); } };
})();

function restartEngine(){
  topo = null; states = []; manual = false; simSleeping = false; inputPressed = false; lastNow = null; acc = 0;
  if (worker){ worker.terminate(); worker = null; }
  if (mode === 'sync') initSync(); else initWorker();
}
if (!LOCKED) window.XOXOGel = window.GelButton = {
  reset: resetIdle,
  get params(){ return {...P}; }
};
(async () => {
  try {
    curShape = await GelShape.build(document.getElementById('gel-shape').textContent, {fillHoles:false});
    sdShape = gelGridSDF(curShape);
    restartEngine();
    requestRender();
  } catch(err){
    console.error('XOXO gel could not initialise',err);
    setInstruction('XOXO · static preview');
  }
})();
})();
